<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>La colección · Marcos Torres · Relojes Artesanales de Lujo</title>
  <meta name="description" content="La colección completa de relojes artesanales de Marcos Torres: piezas de pared y de mesa, únicas y hechas a mano en Miami." />
  <meta name="theme-color" content="#0d0b09" />
  <link rel="canonical" href="https://altiora-cu.github.io/marco-torres-design-web/catalogo.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="La colección · Marcos Torres" />
  <meta property="og:description" content="Relojes de pared y de mesa, únicos y hechos a mano en Miami." />
  <meta property="og:image" content="assets/img/hero-poster.webp" />
  <meta property="og:locale" content="es_ES" />

  <link rel="preload" as="image" href="assets/img/cuba.webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" /></noscript>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="pagina-coleccion">
  <a class="saltar" href="#coleccion" data-t="coleccion.titulo">La colección</a>

  <nav class="isla" aria-label="Principal">
    <a class="isla__marca" href="index.html" data-t="marca.nombre">Marcos Torres</a>
    <!-- Texto de respaldo para que la isla no salte; JS lo repinta desde config.js -->
    <div class="isla__links" data-menu><a href="index.html#sala">La sala</a><a href="index.html#tu-reloj">Tu reloj</a><a href="index.html#redes">Redes</a></div>
    <a class="btn btn--oro btn--sm" href="index.html#tu-reloj" data-wa="encargo" data-t="menu.cta">Encargar pieza</a>
    <button class="isla__menu" type="button" aria-expanded="false" aria-controls="telon">
      <span class="sr-only" data-t="menu.abrir"></span><i></i><i></i>
    </button>
  </nav>
  <div class="telon" id="telon" hidden>
    <ul data-menu-telon></ul>
  </div>

  <main id="contenido">
    <header class="coleccion__cabeza">
      <p class="ceja" data-t="coleccion.eyebrow">La sala completa</p>
      <h1 data-t="coleccion.titulo">La colección</h1>
      <p data-t="coleccion.texto">Piezas únicas, hechas a mano. Toca una para verla de cerca.</p>
    </header>

    <!-- Las piezas se pintan desde config.js; cada foto lleva sus medidas para no mover la página -->
    <ol class="coleccion" id="coleccion"></ol>

    <div class="coleccion__volver">
      <a class="btn btn--linea" href="index.html" data-t="coleccion.volver"></a>
    </div>
  </main>

  <footer class="pie" id="contacto">
    <p class="pie__marca" data-t="marca.nombre">Marcos Torres</p>
    <p class="pie__tag"><span data-t="pie.tag"></span> · <span data-t="contacto.ciudad"></span></p>
    <div class="pie__links" data-social></div>
    <p class="pie__legal">© <span data-year></span> <span data-t="pie.legal"></span></p>
  </footer>

  <a href="index.html#tu-reloj" class="wa-flotante" data-wa="flotante" data-aria="menu.whatsapp">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M16 3C9.4 3 4 8.4 4 15c0 2.1.6 4.2 1.6 6L4 29l8.2-1.6c1.7.9 3.6 1.4 5.6 1.4h.2c6.6 0 12-5.4 12-12S22.6 3 16 3zm7 17c-.3.8-1.6 1.5-2.2 1.6-.6.1-1.3.1-2.1-.1-.5-.2-1.1-.4-1.9-.7-3.3-1.4-5.5-4.8-5.6-5-.2-.2-1.4-1.8-1.4-3.5s.9-2.5 1.2-2.8c.3-.3.7-.4.9-.4h.6c.2 0 .5 0 .7.5s.9 2.1.9 2.3c.1.2.1.4 0 .6-.1.2-.2.4-.4.6-.2.2-.4.5-.5.6-.2.2-.4.4-.2.7.2.3.9 1.4 1.9 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.3.7-.2s2 .9 2.3 1.1c.3.2.5.2.6.4.1.1.1.8-.2 1.6z"/></svg>
  </a>

  <dialog class="vitrina" id="vitrina" aria-labelledby="v-nombre">
    <div class="vitrina__caja">
      <div class="vitrina__obra" id="v-obra">
        <img id="v-img" alt="" width="800" height="1000" decoding="async" />
        <span class="vitrina__brillo" aria-hidden="true"></span>
      </div>
      <div class="vitrina__ficha">
        <p class="vitrina__serie" id="v-serie"></p>
        <h2 id="v-nombre"></h2>
        <p class="vitrina__sub" id="v-sub"></p>
        <p id="v-texto"></p>
        <dl>
          <div><dt data-t="vitrina.formato"></dt><dd id="v-tipo"></dd></div>
          <div><dt data-t="vitrina.materiales"></dt><dd id="v-mat"></dd></div>
        </dl>
        <div class="vitrina__ctas">
          <a class="btn btn--oro" href="index.html#tu-reloj" id="v-cta" data-t="vitrina.cta"></a>
          <a class="btn btn--linea" href="index.html#tu-reloj" id="v-parecida" data-t="vitrina.parecida"></a>
        </div>
      </div>
      <div class="vitrina__nav">
        <button type="button" id="v-prev" data-aria="vitrina.anterior">←</button>
        <button type="button" id="v-next" data-aria="vitrina.siguiente">→</button>
        <button type="button" id="v-cerrar" data-t="vitrina.cerrar"></button>
      </div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
